<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Django Workshop</title>
</head>
<body>
    <h1>My Django App</h1>
    <p>Messages saved in PostgreSQL:</p>
    <ul>
        {% for message in messages %}
            <li>{{ message.text }} — {{ message.created_at }}</li>
        {% empty %}
            <li>No messages yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
